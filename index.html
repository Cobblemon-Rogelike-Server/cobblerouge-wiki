<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="CobbleRouge 게임 위키. 던전 입장과 진행, 유전자 조작소, 종료 보상, 탐험단과 섬 생활의 규칙을 찾아보세요."
    />
    <title>CobbleRouge 위키</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="CobbleRouge 위키 홈"
        ><img src="./favicon.svg" width="30" height="30" alt="" /><span
          >CobbleRouge <span class="brand-label">위키</span></span
        ></a
      >
      <form id="search-form" class="global-search" role="search">
        <span id="search-icon" aria-hidden="true"></span
        ><input
          id="search"
          type="search"
          name="q"
          autocomplete="off"
          placeholder="던전 입장, 유전자, 딸기 검색"
          aria-label="위키 전체 검색"
        /><kbd id="search-shortcut" aria-hidden="true">Ctrl K</kbd>
      </form>
      <div class="header-links">
        <a href="#/article/getting-started">처음 시작하기</a
        ><button
          id="menu-toggle"
          class="menu-toggle"
          aria-label="메뉴 열기"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          메뉴
        </button>
      </div>
    </header>
    <button
      id="menu-backdrop"
      class="menu-backdrop"
      aria-label="메뉴 닫기"
      hidden
      tabindex="-1"
    ></button>
    <aside class="sidebar" id="sidebar" aria-label="위키 탐색">
      <nav id="navigation" aria-label="위키 분류"></nav>
      <div class="sidebar-footer">
        <p>수치와 규칙은 운영 서버의<br />현재 안내를 확인하세요.</p>
        <a
          href="https://github.com/Cobblemon-Rogelike-Server/cobblerouge-wiki/issues/new"
          target="_blank"
          rel="noopener noreferrer"
          >오류 제보 <span aria-hidden="true">↗</span></a
        >
      </div>
    </aside>
    <div class="workspace">
      <main id="main" tabindex="-1">
        <div class="loading" role="status">위키를 불러오는 중입니다.</div>
      </main>
      <footer>
        <span>CobbleRouge 위키</span>
        <div>
          <a
            href="https://github.com/Cobblemon-Rogelike-Server/cobblerouge-wiki"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub <span aria-hidden="true">↗</span></a
          ><a href="./LICENSE.txt">이용 안내·저작권</a>
        </div>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="noscript">
        위키를 탐색하려면 브라우저에서 JavaScript를 켜 주세요.
      </p></noscript
    >
  </body>
</html>
